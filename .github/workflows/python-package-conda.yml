name: HOMER quality checks

on:
  push:
    branches: ["**"]
name: Python CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.11 • Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install core dependencies
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and CI dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app setup.py
      - name: Run tests
        run: python -m pytest -q
          python -m pip install flake8

      - name: Check Python syntax and undefined names
        run: python -m flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Report style issues across the repository
        run: python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          python -m pip install flake8

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: python -m pytest -v
