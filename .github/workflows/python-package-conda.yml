name: HOMER quality checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.11 core tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and CI dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install flake8

      - name: Compile Python modules
        run: python -m compileall -q app setup.py

      - name: Check syntax and undefined names
        run: python -m flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run test suite
        run: python -m pytest -q

      - name: Report repository style issues
        run: python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
